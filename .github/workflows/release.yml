# Pushing a tag k3346-vX.Y.Z publishes a release: two SD card archives built from
# that tag, SHA256SUMS, and the tag's section of CHANGELOG.md as the notes.
name: release

on:
  push:
    tags: ['k3346-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rgd_hook.jar must carry its non-class resources: VCTextData reads
      # vc-text.bin on first use (VC street scroll) and throws without it.
      - name: Check the jar resources
        run: |
          set -eu
          for e in com/mhi2/carplay/rgd/vc-text.bin META-INF/UNICODE-LICENSE.txt; do
            unzip -Z1 bin/rgd_hook.jar | grep -qx "$e" || { echo "bin/rgd_hook.jar: missing $e"; exit 1; }
          done

      - name: Build the SD card archives
        run: |
          set -eu
          VER=$GITHUB_REF_NAME
          mkdir -p stage/mod/carplay dist
          cp custom.sh command.sh stage/mod/
          cp -r install.sh uninstall.sh bin stage/mod/carplay/
          echo "$VER" > stage/mod/carplay/VERSION
          (cd stage && zip -q -r -X ../dist/mhi2-aug22-carplay-$VER-sd.zip mod)
          # The same card with the UNINSTALL marker: running the script removes
          # everything instead of installing.
          touch stage/mod/carplay/UNINSTALL
          (cd stage && zip -q -r -X ../dist/mhi2-aug22-carplay-$VER-uninstall-sd.zip mod)
          (cd dist && sha256sum *.zip) > dist/SHA256SUMS
          (cd stage/mod/carplay && find bin -type f 2>/dev/null | LC_ALL=C sort | xargs sha256sum) >> dist/SHA256SUMS

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            /^## / { if (p) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { p = 1; next } }
            p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $GITHUB_REF_NAME"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
